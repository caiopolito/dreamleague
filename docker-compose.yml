networks:
  dreamleague-network:
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  dreamleague-gameserver:
    name: 'dreamleague-gameserver'
  dreamleague-main-db:
    name: 'dreamleague-main-db'
  dreamleague-matches-db:
    name: 'dreamleague-matches-db'
  dreamleague-mongo-db:
    name: 'dreamleague-mongo-db'

services:
  gameserver:
    image: ghcr.io/caiopolito/dreamleague-gameserver:latest
    restart: unless-stopped
    # On first start CS2 is downloaded via SteamCMD (~35 GB) and plugins are
    # installed into the named volume. Subsequent starts reuse the volume and
    # skip the download. To update plugins, change METAMODURL / MATCHZYURL and
    # restart. To force a CS2 update, set CS2_FORCE_UPDATE=1 and restart.
    environment:
      DREAMLEAGUE_MATCH_DATABASE: mongodb://root:${MONGO_ROOT_PASSWORD}@dreamleague-database-matches-1:27017
      DREAMLEAGUE_MATCH_DATABASE_NAME: dreamleague
      DREAMLEAGUE_MATCH_DATABASE_COLLECTION: matches
      # CS2_INSTALL_PLUGINS: 0  # uncomment to start bare CS2 without any plugins
      METAMODURL: https://github.com/alliedmodders/metamod-source/releases/download/2.0.0.1401/mmsource-2.0.0-git1401-linux.tar.gz
      MATCHZYURL: https://github.com/caiopolito/MatchZy/releases/download/0.8.15/MatchZy-0.8.15-with-cssharp-linux.zip
      # CS2_FORCE_UPDATE: 0
    ports:
      - 27015:27015/tcp
      - 27015:27015/udp
      - 27020:27020/udp
    volumes:
      - dreamleague-gameserver:/home/steam/cs2server/
    networks:
      dreamleague-network:
        ipv4_address: 172.20.128.1

  database-matches:
    build:
      context: ./dreamleague.matches.db/docker
      dockerfile: Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - 27017:27017
    volumes:
      - dreamleague-matches-db:/data/db
      - dreamleague-mongo-db:/data/configdb
    networks:
      - dreamleague-network

  database-main:
    build:
      context: ./dreamleague.main.db/docker
      dockerfile: Dockerfile
    restart: always
    depends_on:
      gameserver:
        condition: service_started
        restart: true
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - 1433:1433
    volumes:
      - dreamleague-main-db:/var/opt/mssql
    networks:
      - dreamleague-network

  api:
    build:
      context: ./dreamleague.api
      dockerfile: docker/Dockerfile
    depends_on:
      database-main:
        condition: service_healthy
        restart: true
      database-matches:
        condition: service_healthy
        restart: true
    environment:
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/dockerapissl.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${KESTREL_CERT_PASSWORD}
      - Authentication__SteamApiKey=${STEAM_API_KEY}
    ports:
      - 5000:5000
      - 5001:5001
    networks:
      - dreamleague-network
    volumes:
      - ~/.aspnet/https:/https:ro

  app:
    build:
      context: ./dreamleague.app
      dockerfile: docker/Dockerfile
    depends_on:
      database-main:
        condition: service_healthy
        restart: true
      database-matches:
        condition: service_healthy
        restart: true
      api:
        condition: service_started
        restart: true
    ports:
      - 3000:3000
    networks:
      - dreamleague-network
      

    