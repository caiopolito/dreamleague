version: "3.3"

networks:
  dreamleague-network: {}

volumes:
  dreamleague-main-db:
    name: 'dreamleague-main-db'
  dreamleague-matches-db:
    name: 'dreamleague-matches-db'

services:
  database-main:
    build:
      context: ./dreamleague.main.db/docker
      dockerfile: Dockerfile
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password1234!
      - MSSQL_PID=Developer
    ports:
      - 1433:1433
    volumes:
      - dreamleague-main-db:/var/opt/mssql
    networks:
      - dreamleague-network

  database-matches:
    build:
      context: ./dreamleague.matches.db/docker
      dockerfile: Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Password1234!
    ports:
      - 27017:27017
    volumes:
      - dreamleague-matches-db:/data/db
    networks:
      - dreamleague-network

  api:
    build:
      context: ./dreamleague.api
      dockerfile: docker/Dockerfile
    depends_on:
      database-main:
        condition: service_healthy
        restart: true
      database-matches:
        condition: service_healthy
        restart: true
    environment:
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/dockerapissl.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Password1234!
    ports:
      - 5000:5000
      - 5001:5001
    networks:
      - dreamleague-network
    volumes:
      - ~/.aspnet/https:/https:ro

  app:
    build:
      context: ./dreamleague.app
      dockerfile: docker/Dockerfile
    depends_on:
      database-main:
        condition: service_healthy
        restart: true
      database-matches:
        condition: service_healthy
        restart: true
      api:
        condition: service_started
        restart: true
    ports:
      - 3000:3000
    networks:
      - dreamleague-network

    