name: Build Gameserver Image

# Builds the plugin layer (Metamod + CounterStrikeSharp + MatchZy) on top of
# the pre-built CS2 base image and pushes it to GHCR.
#
# Triggers:
#   - Push to master that changes anything under dreamleague.gameserver/
#   - After the base image workflow completes (automatic chain)
#   - Manually via workflow_dispatch

on:
  push:
    branches:
      - master
    paths:
      - "dreamleague.gameserver/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dreamleague-gameserver

jobs:
  build-and-push:
    name: Build and push gameserver image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dreamleague.gameserver/docker
          file: ./dreamleague.gameserver/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass default ARGs — override in repository secrets for production values
          build-args: |
            METAMODURL=${{ vars.METAMODURL || 'https://mms.alliedmods.net/mmsdrop/2.0/mmsource-2.0.0-git1390-linux.tar.gz' }}
            MATCHZYURL=${{ vars.MATCHZYURL || 'https://github.com/caiopolito/MatchZy/releases/download/0.8.15/MatchZy-0.8.15-with-cssharp-linux.zip' }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
