name: Build Gameserver Image

# Builds the slim gameserver image (Ubuntu 20.04 + SteamCMD + entrypoint).
# CS2 and plugins are downloaded at container startup, not baked into the image.
#
# Triggers:
#   - Push to master that changes anything under dreamleague.gameserver/
#   - Manually via workflow_dispatch

on:
  push:
    branches:
      - master
    paths:
      - "dreamleague.gameserver/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dreamleague-gameserver

jobs:
  build-and-push:
    name: Build and push gameserver image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dreamleague.gameserver/docker
          file: ./dreamleague.gameserver/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
