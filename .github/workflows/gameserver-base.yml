name: Build CS2 Base Image

# Builds the ~30 GB CS2 base image and pushes it to GHCR.
#
# Trigger manually (workflow_dispatch) whenever a CS2 update needs to be
# applied, or let the weekly schedule keep it up-to-date automatically.
# The plugin image (gameserver.yml) is built on top of this one.

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dreamleague-cs2-base

jobs:
  build-and-push:
    name: Build and push CS2 base image
    runs-on: ubuntu-20.04
    # Large image — give it plenty of time (steamcmd download can be slow)
    timeout-minutes: 360

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD'}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dreamleague.gameserver/docker
          file: ./dreamleague.gameserver/docker/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers across builds — saves re-downloading CS2 if only
          # apt packages or minor layers change
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

